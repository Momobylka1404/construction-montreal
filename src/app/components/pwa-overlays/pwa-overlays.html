<!-- INDICATEUR GLISSÉ POUR ACTUALISER (MOBILE / PWA) -->
<div
  class="ptr-indicator"
  [class.is-visible]="pwa.pullDistance() > 6 || pwa.isRefreshing()"
  [class.is-pulling]="pwa.isPulling()"
  [class.is-ready]="pwa.pullReady()"
  [class.is-refreshing]="pwa.isRefreshing()"
  [style.--ptr-y]="pwa.pullDistance() + 'px'"
  role="status"
  aria-live="polite"
  [attr.aria-hidden]="pwa.pullDistance() <= 6 && !pwa.isRefreshing()"
>
  <span class="ptr-pill">
    <span class="ptr-icon" [style.--ptr-rot]="pwa.pullRotation() + 'deg'" aria-hidden="true">
      @if (pwa.isRefreshing()) {
        <svg
          class="ptr-spinner"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          focusable="false"
        >
          <path stroke-linecap="round" d="M21 12a9 9 0 1 1-2.64-6.36" />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          focusable="false"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m0 0-5-5m5 5 5-5" />
        </svg>
      }
    </span>
    <span class="ptr-label">
      @if (pwa.isRefreshing()) {
        {{ i18n.t().ptr.refreshing }}
      } @else if (pwa.pullReady()) {
        {{ i18n.t().ptr.release }}
      } @else {
        {{ i18n.t().ptr.pull }}
      }
    </span>
  </span>
</div>

<!-- NOTIFICATION DE MISE À JOUR PWA (SERVICE WORKER) -->
@if (pwa.pwaUpdateReady()) {
  <div class="pwa-update-toast" role="status" aria-live="polite">
    <span>{{ i18n.t().pwa.updateMessage }}</span>
    <div class="pwa-update-actions">
      <button type="button" class="btn btn-gold btn-sm" (click)="pwa.applyPwaUpdate()">
        {{ i18n.t().pwa.updateAction }}
      </button>
      <button
        type="button"
        class="pwa-update-dismiss"
        [attr.aria-label]="i18n.t().pwa.updateDismissAria"
        (click)="pwa.dismissPwaUpdate()"
      >
        ×
      </button>
    </div>
  </div>
}

<!-- ACTIONS FLOTTANTES (WHATSAPP + RETOUR EN HAUT) -->
<div class="floating-dock">
  @if (showBackToTop()) {
    <button
      type="button"
      class="back-to-top"
      [attr.aria-label]="i18n.t().a11y.backToTop"
      (click)="scrollToTop.emit()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        aria-hidden="true"
        focusable="false"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6" />
      </svg>
    </button>
  }

  <a
    class="whatsapp-fab"
    [href]="i18n.whatsappDirectUrl()"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="i18n.t().a11y.whatsappFab"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <path
        d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.49 0 .14 5.34.14 11.91c0 2.1.55 4.15 1.59 5.95L0 24l6.31-1.65a11.87 11.87 0 0 0 5.75 1.47h.01c6.57 0 11.92-5.34 11.92-11.91 0-3.18-1.24-6.17-3.47-8.43Zm-8.46 18.32h-.01a9.87 9.87 0 0 1-5.04-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.85 9.85 0 0 1-1.52-5.26c0-5.45 4.44-9.89 9.91-9.89 2.64 0 5.13 1.03 7 2.9a9.83 9.83 0 0 1 2.9 7c0 5.45-4.44 9.88-9.9 9.88Zm5.43-7.41c-.3-.15-1.76-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.08-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.21 5.09 4.5.71.31 1.27.49 1.7.63.71.23 1.36.2 1.88.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35Z"
      />
    </svg>
    <span class="whatsapp-fab-label">WhatsApp</span>
  </a>
</div>
