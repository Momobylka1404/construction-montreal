<a
  class="skip-link"
  [href]="i18n.sectionHref('contenu')"
  (click)="scrollToSection($event, 'contenu')"
  >{{ i18n.t().a11y.skipToContent }}</a
>

<app-site-header
  [isScrolled]="isScrolled()"
  [activeSection]="activeSection()"
  [mobileMenuOpen]="mobileMenuOpen()"
  (toggleMenu)="toggleMobileMenu()"
  (closeMenu)="closeMobileMenu()"
  (navigateSection)="onNavigateSection($event)"
/>

<main id="contenu" tabindex="-1">
  <!-- 01. Accueil — Présentation et message principal -->
  <app-hero-section (navigateSection)="onNavigateSection($event)" />

  <!-- 02. Nos expertises — Tous les services proposés -->
  <app-services-section (requestQuote)="requestQuoteForService($event)" />

  <!-- 03. Nos réalisations — Galerie de projets et photos -->
  <app-realisations-section [(filter)]="realisationFilter" (openProject)="openLightbox($event)" />

  <!-- 04. Pourquoi nous choisir — Nos engagements et notre savoir-faire -->
  <app-about-process-section (navigateSection)="onNavigateSection($event)" />

  <!-- 05. Avis clients — Témoignages -->
  <app-reviews-section (requestQuote)="requestQuoteForService($event)" />

  <!-- 06. FAQ — Questions fréquentes -->
  <app-faq-section />

  <!-- 07. Contact — Demande de devis et coordonnées -->
  <app-contact-section [selectedService]="selectedService()" (openPrivacy)="openPrivacyModal()" />
</main>

<app-site-footer
  (navigateSection)="onNavigateSection($event)"
  (requestQuote)="requestQuoteForService($event)"
  (openPrivacy)="openPrivacyModal()"
/>

<router-outlet />

@defer (when privacyModalOpen(); prefetch on idle) {
  @if (privacyModalOpen()) {
    <app-privacy-modal (close)="closePrivacyModal()" />
  }
}

@defer (when activeRealisation() !== null; prefetch on idle) {
  @if (activeRealisation(); as project) {
    <app-lightbox-modal
      [project]="project"
      [index]="activeRealisationIndex()"
      [total]="lightboxRealisations().length"
      (close)="closeLightbox()"
      (navigate)="navigateLightbox($event)"
      (requestQuote)="requestQuoteForService($event)"
    />
  }
}

<app-pwa-overlays [showBackToTop]="showBackToTop()" (scrollToTop)="scrollToTop()" />
