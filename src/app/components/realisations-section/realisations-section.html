<section
  class="section section-alabaster"
  id="realisations"
  data-nav-section="realisations"
  aria-labelledby="realisations-title"
>
  <div class="container container-wide">
    <div class="section-head section-head-center" data-reveal>
      <p class="eyebrow">
        <span class="eyebrow-line" aria-hidden="true"></span>
        {{ i18n.t().realisationsSection.eyebrow }}
        <span class="eyebrow-line" aria-hidden="true"></span>
      </p>
      <h2 id="realisations-title" class="section-title">
        {{ i18n.t().realisationsSection.titleMain }}
        <em>{{ i18n.t().realisationsSection.titleAccent }}</em>
      </h2>
      <p class="section-subtitle">{{ i18n.t().realisationsSection.subtitle }}</p>

      <div
        class="filter-tabs filter-tabs-center"
        role="tablist"
        [attr.aria-label]="i18n.t().a11y.filterRealisations"
      >
        <button
          type="button"
          role="tab"
          class="filter-tab"
          [class.is-active]="filter() === 'all'"
          [attr.aria-selected]="filter() === 'all'"
          (click)="setFilter('all')"
        >
          {{ i18n.t().realisationsSection.filterAll }} <span>({{ counts().all }})</span>
        </button>
        <button
          type="button"
          role="tab"
          class="filter-tab"
          [class.is-active]="filter() === 'batiment'"
          [attr.aria-selected]="filter() === 'batiment'"
          (click)="setFilter('batiment')"
        >
          {{ i18n.t().realisationsSection.filterBuilding }} <span>({{ counts().batiment }})</span>
        </button>
        <button
          type="button"
          role="tab"
          class="filter-tab"
          [class.is-active]="filter() === 'exterieur'"
          [attr.aria-selected]="filter() === 'exterieur'"
          (click)="setFilter('exterieur')"
        >
          {{ i18n.t().realisationsSection.filterExterior }} <span>({{ counts().exterieur }})</span>
        </button>
      </div>
    </div>

    <div class="realisations-grid" data-reveal>
      @for (item of filteredRealisations(); track item.id) {
        <article class="realisation-card">
          <button
            type="button"
            class="realisation-trigger"
            (click)="openProject.emit(item.id)"
            [attr.aria-label]="i18n.t().a11y.compareLarge + ' : ' + item.title"
          >
            <div class="comparison-images">
              <div class="comparison-photo">
                <img
                  [src]="item.beforeImage"
                  [alt]="item.beforeAlt"
                  width="440"
                  height="580"
                  loading="lazy"
                  decoding="async"
                />
                <span class="photo-label avant">{{
                  i18n.t().realisationsSection.beforeBadge
                }}</span>
              </div>
              <div class="comparison-photo">
                <img
                  [src]="item.afterImage"
                  [alt]="item.afterAlt"
                  width="440"
                  height="580"
                  loading="lazy"
                  decoding="async"
                />
                <span class="photo-label apres">{{ i18n.t().realisationsSection.afterBadge }}</span>
              </div>

              <span class="zoom-hint" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  focusable="false"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"
                  />
                </svg>
                {{ i18n.t().realisationsSection.compareHint }}
              </span>
            </div>

            <div class="realisation-info">
              <span class="realisation-icon" aria-hidden="true">
                @switch (item.icon) {
                  @case ('construction') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5M9.5 20v-5.5h5V20"
                      />
                    </svg>
                  }
                  @case ('renovation') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.1-3.1a5 5 0 0 1-6.6 6.6L6.6 20.4a2.1 2.1 0 0 1-3-3l7.6-7.6a5 5 0 0 1 6.6-6.6l-3.1 3.1Z"
                      />
                    </svg>
                  }
                  @case ('peinture') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <rect x="3" y="4" width="14" height="5" rx="1.5" />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M17 6.5h2a1.5 1.5 0 0 1 1.5 1.5v2a1.5 1.5 0 0 1-1.5 1.5h-7a1.5 1.5 0 0 0-1.5 1.5v2"
                      />
                      <rect x="9" y="15" width="3" height="6" rx="1" />
                    </svg>
                  }
                  @case ('pavage') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="2" />
                      <path d="M3 9.5h18M3 14.5h18M9 4v5.5M15 9.5v5M9 14.5V20" />
                    </svg>
                  }
                  @case ('jardins') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M5 20c1.5-5.5 6-10 14-12-1 8-5.5 12-12 12H5Z"
                      />
                      <path stroke-linecap="round" d="M5 20c2-3 5-5.5 9-7" />
                    </svg>
                  }
                  @case ('piscine') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2 15.5c1.5 1 3.5 1 5 0s3.5-1 5 0 3.5 1 5 0 3.5-1 5 0M2 19.5c1.5 1 3.5 1 5 0s3.5-1 5 0 3.5 1 5 0 3.5-1 5 0"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 12V6a2 2 0 0 1 4 0M15 12V6a2 2 0 0 1 4 0M8 9h7"
                      />
                    </svg>
                  }
                  @case ('dechets') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M7 19a4 4 0 0 1-3.5-6l2-3.5M17 19a4 4 0 0 0 3.5-6l-2-3.5M9.5 6.5 12 3l2.5 3.5M8 19h8"
                      />
                    </svg>
                  }
                  @case ('paysagement') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      focusable="false"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 21v-7m0 0c-3.5 0-6-2.2-6-5.5A5.5 5.5 0 0 1 12 3a5.5 5.5 0 0 1 6 5.5c0 3.3-2.5 5.5-6 5.5Z"
                      />
                      <path stroke-linecap="round" d="M6 21h12" />
                    </svg>
                  }
                }
              </span>

              <div class="realisation-meta">
                <h3>{{ item.title }}</h3>
                <p>{{ item.tagline }}</p>
              </div>

              <span class="realisation-arrow" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  focusable="false"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </span>
            </div>
          </button>
        </article>
      }
    </div>
  </div>
</section>
