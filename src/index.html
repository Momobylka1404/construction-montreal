    <!-- Données structurées FAQ (Schema.org FAQPage) -->
    <script id="schema-faq" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "La soumission est-elle vraiment gratuite et sans engagement ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, entièrement. Après réception de votre demande, nous vous répondons habituellement en 24 à 48 heures. Au besoin, nous planifions une visite sur place afin d’évaluer précisément les travaux et de vous remettre une estimation claire, détaillée et sans aucune obligation."
            }
          },
          {
            "@type": "Question",
            "name": "Quels arrondissements et quelles villes desservez-vous ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Basés dans l’arrondissement de Saint-Laurent à Montréal, nous intervenons dans l’ensemble de l’île de Montréal (Ahuntsic, Rosemont, Villeray, Plateau-Mont-Royal, Verdun, NDG, Lachine, Anjou, Mercier, Ouest-de-l’Île, etc.) ainsi qu’à Laval et sur la Rive-Sud."
            }
          },
          {
            "@type": "Question",
            "name": "Puis-je combiner plusieurs services dans une seule soumission ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolument — c’est même notre plus grande force. Vous pouvez regrouper, par exemple, une rénovation intérieure avec la peinture complète, ou un projet de pavage avec l’aménagement paysager, l’entretien du jardin et l’évacuation des déchets verts, le tout coordonné par un seul partenaire."
            }
          },
          {
            "@type": "Question",
            "name": "Quels sont vos délais pour commencer les travaux ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pour les services d’entretien extérieur (jardins, nettoyage de piscine, ramassage de déchets verts) et la peinture, nous pouvons souvent intervenir en quelques jours. Pour la construction, la rénovation et le pavage, nous convenons avec vous d’un échéancier réaliste dès la validation de la soumission."
            }
          },
          {
            "@type": "Question",
            "name": "Comment assurez-vous la qualité, la sécurité et la propreté du chantier ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Chaque intervention est couverte et réalisée dans le respect des règles de l’art, avec des matériaux adaptés au climat québécois. Nous protégeons soigneusement vos planchers, meubles et accès, assurons un nettoyage complet en fin de travaux et effectuons une vérification finale avec vous pour garantir votre entière satisfaction."
            }
          },
          {
            "@type": "Question",
            "name": "Offrez-vous des interventions ponctuelles ou un entretien saisonnier régulier ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nous offrons les deux formules selon vos besoins : interventions ponctuelles (ouverture ou nettoyage de piscine, grand ménage printanier, ramassage automnal de feuilles et branches) ou passages réguliers tout au long de la belle saison pour garder votre terrain et votre piscine impeccables."
            }
          },
          {
            "@type": "Question",
            "name": "Quelles informations fournir pour obtenir une estimation rapide et précise ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Indiquez le ou les services souhaités, votre arrondissement ou ville, l’échéancier visé et une brève description des travaux (dimensions approximatives, état actuel). Vous pouvez aussi joindre jusqu’à 4 photos directement dans notre formulaire ou par WhatsApp pour accélérer l’évaluation."
            }
          }
        ]
